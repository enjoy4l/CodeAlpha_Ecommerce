<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abi's Electronics - Cart</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Abi's Electronics</a>
    <a href="/">Continue shopping</a>
  </header>

  <main class="container">
    <section class="intro">
      <p class="eyebrow">Your selection</p>
      <h1>Shopping cart.</h1>
    </section>

    <p id="cart-status" class="status" role="status">Loading cart...</p>
    <section id="cart-items" class="cart-items" aria-label="Cart items"></section>
    <section id="cart-summary" class="cart-summary" hidden>
      <p class="cart-total">Total <strong id="cart-total-amount">$0.00</strong></p>
      <button id="checkout-button" class="primary-button" type="button">Checkout</button>
    </section>
    <p id="cart-message" class="form-message" role="status" hidden></p>
  </main>

  <script src="cart.js"></script>
</body>
</html>
