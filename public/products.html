<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abi's Electronics - Shop All</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Abi's home">Abi's</a>
    <label class="search-field header-search" for="product-search">
      <span aria-hidden="true">Search</span>
      <input id="product-search" type="search" placeholder="Search products" autocomplete="off">
    </label>
    <nav id="auth-nav" class="auth-nav" aria-label="Account navigation"></nav>
  </header>

  <main class="shop-page container">
    <header class="shop-heading">
      <div>
        <p class="shop-heading__text">Browse dependable appliances and entertainment essentials for every room at home.</p>
      </div>
    </header>

    <div class="shop-layout">
      <aside class="category-sidebar" aria-label="Shop by category">
        <p class="sidebar-label">Shop by category</p>
        <div id="category-list" class="category-list">
          <button class="category-option active" type="button" data-category="All">All products <span></span></button>
          <button class="category-option" type="button" data-category="Kitchen">Kitchen <span></span></button>
          <button class="category-option" type="button" data-category="Laundry">Laundry <span></span></button>
          <button class="category-option" type="button" data-category="Refrigeration">Refrigeration <span></span></button>
          <button class="category-option" type="button" data-category="Entertainment">Entertainment <span></span></button>
          <button class="category-option" type="button" data-category="Cooling">Cooling <span></span></button>
          <button class="category-option" type="button" data-category="Cleaning">Cleaning <span></span></button>
        </div>
      </aside>

      <section class="shop-results" aria-label="Product catalogue">
        <div class="shop-toolbar">
          <p id="results-count" class="results-count" role="status"></p>
        </div>
        <p id="catalog-status" class="status" role="status">Loading products...</p>
        <section id="catalog-grid" class="product-grid" aria-label="All products"></section>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <nav class="footer-links" aria-label="Footer navigation">
      <a href="/">About</a>
      <a href="products.html">Shop all</a>
      <a href="products.html?category=Kitchen">Kitchen</a>
      <a href="products.html?category=Entertainment">Entertainment</a>
      <a href="products.html?category=Cleaning">Home care</a>
    </nav>
    <div class="footer-meta">
      <p>Secure shopping and reliable support for every home.</p>
      <p>&copy; 2026 Abi's Electronics. All rights reserved.</p>
    </div>
  </footer>

  <script src="products.js"></script>
</body>
</html>
