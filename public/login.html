<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abi's Electronics - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="category-menu" aria-label="Open categories">
      <span></span><span></span><span></span>
    </button>
    <a class="brand" href="/" aria-label="Abi's home">Abi's</a>
    <a href="register.html">Create account</a>
    <nav id="category-menu" class="category-menu" aria-label="Category menu" hidden>
      <a href="products.html">Shop all</a>
      <a href="products.html?category=Refrigeration">Refrigeration</a>
      <a href="products.html?category=Kitchen">Kitchen</a>
      <a href="products.html?category=Entertainment">Entertainment</a>
      <a href="products.html?category=Cleaning">Home care</a>
    </nav>
  </header>

  <main class="form-container">
    <section class="auth-panel">
      <p class="eyebrow">Welcome back</p>
      <h1>Log in.</h1>
      <form id="login-form" class="auth-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <p id="form-message" class="form-message" role="alert" hidden></p>
        <button type="submit">Log in</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <nav class="footer-links" aria-label="Footer navigation">
      <a href="/">About</a>
      <a href="/">How it works</a>
      <a href="/">Community</a>
      <a href="/">Privacy Policy</a>
      <a href="/">Terms of Service</a>
    </nav>
    <div class="footer-meta">
      <p>Secure shopping and reliable support for every home.</p>
      <p>&copy; 2026 Abi's Electronics. All rights reserved.</p>
    </div>
  </footer>

  <script src="menu.js"></script>
  <script src="login.js"></script>
</body>
</html>
