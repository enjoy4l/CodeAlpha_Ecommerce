<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abi's Electronics - Register</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Abi's Electronics</a>
    <a href="login.html">Log in</a>
  </header>

  <main class="form-container">
    <section class="auth-panel">
      <p class="eyebrow">Create an account</p>
      <h1>Join Abi's Electronics.</h1>
      <form id="register-form" class="auth-form">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required>

        <p id="form-message" class="form-message" role="alert" hidden></p>
        <button type="submit">Create account</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <nav class="footer-links" aria-label="Footer navigation">
      <a href="/">About</a>
      <a href="/">How it works</a>
      <a href="/">Community</a>
      <a href="/">Privacy Policy</a>
      <a href="/">Terms of Service</a>
    </nav>
    <div class="footer-meta">
      <p>Secure shopping and reliable support for every home.</p>
      <p>&copy; 2026 Abi's Electronics. All rights reserved.</p>
    </div>
  </footer>

  <script src="register.js"></script>
</body>
</html>
